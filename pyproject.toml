[project]
name = "kensho-japan-bundle"
version = "1.0.0"
description = "MCP Bundle: Japan market data, sweepstakes, TCG prices, intel, fuel/wage stats"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kensho Project" }]
dependencies = [
    "fastmcp>=3.0.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
]

[project.scripts]
kensho-japan-bundle = "src.stdio_main:main"

[tool.uv]
package = false
